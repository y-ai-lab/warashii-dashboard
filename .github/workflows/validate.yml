name: Validate Asset Radar

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate.py'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate.py'
      - 'app.js'
      - 'index.html'
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate opportunity database
        run: python scripts/validate.py
      - name: Check JavaScript syntax
        run: node --check app.js
